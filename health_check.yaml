---
- name: Health Check PC
  hosts: all
  become: false
  gather_facts: true

  tasks:
    - name: Cek user aktual
      ansible.builtin.command:
        cmd: id
      register: current_identity
      changed_when: false

    - name: Tampilkan user aktual
      ansible.builtin.debug:
        var: current_identity.stdout

    - name: Cek disk space
      ansible.builtin.command:
        cmd: df -h /
      register: disk
      changed_when: false

    - name: Cek memory usage
      ansible.builtin.command:
        cmd: free -h
      register: memory
      changed_when: false

    - name: Cek uptime
      ansible.builtin.command:
        cmd: uptime -p
      register: uptime
      changed_when: false

    - name: Cek reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Tampilkan hasil health check
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "User: {{ current_identity.stdout }}"
          - "Hostname: {{ ansible_hostname }}"
          - "IP: {{ ansible_default_ipv4.address | default('Tidak terdeteksi') }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Disk: {{ disk.stdout_lines[-1] }}"
          - "Memory: {{ memory.stdout_lines[1] | default(memory.stdout) }}"
          - "Uptime: {{ uptime.stdout }}"
          - "Reboot: {{ 'Required' if reboot_required.stat.exists else 'Not required' }}"
